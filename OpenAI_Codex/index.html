<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Titanic Dataset Explorer</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap");

      :root {
        --bg: #f4efe8;
        --bg-2: #efe3d4;
        --ink: #1e1b16;
        --muted: #6a5f55;
        --accent: #e07a5f;
        --accent-2: #3d405b;
        --card: #fffaf3;
        --line: #e2d7c9;
        --shadow: 0 20px 50px rgba(61, 64, 91, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
        color: var(--ink);
        background: radial-gradient(1200px 600px at 10% -20%, #f8f1e5 0%, transparent 60%),
          radial-gradient(900px 500px at 90% -10%, #f1d8c3 0%, transparent 70%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        min-height: 100vh;
        padding: 32px 20px 60px;
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        display: grid;
        gap: 18px;
        margin-bottom: 26px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--card);
        border: 1px solid var(--line);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        color: var(--muted);
        width: fit-content;
      }

      .title {
        font-size: clamp(32px, 4vw, 54px);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
      }

      .subtitle {
        margin: 0;
        font-size: 18px;
        color: var(--muted);
        max-width: 720px;
      }

      .hero {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 24px;
        display: grid;
        gap: 18px;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -80px;
        top: -120px;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle at 40% 40%, rgba(224, 122, 95, 0.5), transparent 60%);
        opacity: 0.7;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
      }

      .stat {
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 16px;
        display: grid;
        gap: 6px;
      }

      .stat span {
        font-size: 13px;
        color: var(--muted);
      }

      .stat strong {
        font-size: 20px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
      }

      .search {
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 16px;
        display: flex;
        gap: 10px;
        align-items: center;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        color: var(--muted);
      }

      .search input {
        border: none;
        outline: none;
        font-family: inherit;
        font-size: 14px;
        width: 100%;
      }

      .btn {
        border: none;
        border-radius: 14px;
        padding: 12px 18px;
        font-weight: 600;
        cursor: pointer;
        background: var(--accent-2);
        color: #fff;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(61, 64, 91, 0.25);
      }

      .table-wrap {
        margin-top: 22px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }

      thead {
        background: #f7efe5;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      th {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 600;
      }

      tbody tr:hover {
        background: rgba(224, 122, 95, 0.08);
      }

      .footer {
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
      }

      .pill {
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }

      .fade-in {
        animation: fade 0.6s ease-out both;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 720px) {
        .controls {
          grid-template-columns: 1fr;
        }

        th,
        td {
          padding: 10px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="fade-in">
        <div class="badge">🚢 Titanic · train.csv</div>
        <h1 class="title">Titanic Dataset Explorer</h1>
        <p class="subtitle">
          Browse the Kaggle Titanic dataset in a clean, searchable table. Use the search box to filter passengers by
          any field.
        </p>
      </header>

      <section class="hero fade-in" style="animation-delay: 0.1s">
        <div class="stats" id="stats"></div>
        <div class="controls">
          <label class="search">
            🔎
            <input id="searchInput" type="search" placeholder="Search name, ticket, cabin, age, embarkation..." />
          </label>
          <button class="btn" id="resetBtn" type="button">Reset filters</button>
        </div>
      </section>

      <section class="table-wrap fade-in" style="animation-delay: 0.2s">
        <table>
          <thead>
            <tr id="headerRow"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>

      <div class="footer fade-in" style="animation-delay: 0.3s">
        <span id="rowInfo">Loading rows…</span>
        <div class="pill" id="pageInfo">Page 1</div>
        <button class="btn" id="loadMoreBtn" type="button">Load 100 more</button>
      </div>
    </div>

    <script>
      const csvUrl = "data/train.csv";
      const pageSize = 100;
      let data = [];
      let filtered = [];
      let page = 1;

      const statsEl = document.getElementById("stats");
      const headerRow = document.getElementById("headerRow");
      const tableBody = document.getElementById("tableBody");
      const rowInfo = document.getElementById("rowInfo");
      const pageInfo = document.getElementById("pageInfo");
      const loadMoreBtn = document.getElementById("loadMoreBtn");
      const searchInput = document.getElementById("searchInput");
      const resetBtn = document.getElementById("resetBtn");

      function parseCSV(text) {
        const rows = [];
        let row = [];
        let cell = "";
        let inQuotes = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"' && inQuotes && next === '"') {
            cell += '"';
            i += 1;
          } else if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === "," && !inQuotes) {
            row.push(cell);
            cell = "";
          } else if ((char === "\n" || char === "\r") && !inQuotes) {
            if (cell.length || row.length) {
              row.push(cell);
              rows.push(row);
              row = [];
              cell = "";
            }
          } else {
            cell += char;
          }
        }

        if (cell.length || row.length) {
          row.push(cell);
          rows.push(row);
        }

        return rows;
      }

      function toObjects(rows) {
        const headers = rows[0];
        return rows.slice(1).map((row) => {
          const obj = {};
          headers.forEach((header, idx) => {
            obj[header] = row[idx] ?? "";
          });
          return obj;
        });
      }

      function renderHeader(headers) {
        headerRow.innerHTML = "";
        headers.forEach((header) => {
          const th = document.createElement("th");
          th.textContent = header;
          headerRow.appendChild(th);
        });
      }

      function renderStats() {
        const total = data.length;
        const current = filtered.length;
        const survived = filtered.filter((row) => row.Survived === "1").length;
        const avgAge =
          filtered.reduce((sum, row) => sum + (parseFloat(row.Age) || 0), 0) /
          Math.max(1, filtered.filter((row) => row.Age).length);

        const statItems = [
          { label: "Total passengers", value: total },
          { label: "Filtered passengers", value: current },
          { label: "Survivors", value: survived },
          { label: "Avg age (filtered)", value: avgAge ? avgAge.toFixed(1) : "N/A" },
        ];

        statsEl.innerHTML = "";
        statItems.forEach((stat) => {
          const div = document.createElement("div");
          div.className = "stat";
          div.innerHTML = `<span>${stat.label}</span><strong>${stat.value}</strong>`;
          statsEl.appendChild(div);
        });
      }

      function renderTable() {
        const headers = Object.keys(filtered[0] || {});
        renderHeader(headers);
        tableBody.innerHTML = "";

        const limit = page * pageSize;
        filtered.slice(0, limit).forEach((row) => {
          const tr = document.createElement("tr");
          headers.forEach((header) => {
            const td = document.createElement("td");
            td.textContent = row[header];
            tr.appendChild(td);
          });
          tableBody.appendChild(tr);
        });

        rowInfo.textContent = `Showing ${Math.min(limit, filtered.length)} of ${filtered.length} rows`;
        pageInfo.textContent = `Page ${page}`;
        loadMoreBtn.disabled = limit >= filtered.length;
        loadMoreBtn.textContent = loadMoreBtn.disabled ? "All rows loaded" : "Load 100 more";
      }

      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();
        if (!query) {
          filtered = [...data];
        } else {
          filtered = data.filter((row) =>
            Object.values(row).some((value) => String(value).toLowerCase().includes(query))
          );
        }
        page = 1;
        renderStats();
        renderTable();
      }

      async function init() {
        const res = await fetch(csvUrl);
        const text = await res.text();
        const rows = parseCSV(text);
        data = toObjects(rows);
        filtered = [...data];
        renderStats();
        renderTable();
      }

      loadMoreBtn.addEventListener("click", () => {
        page += 1;
        renderTable();
      });

      searchInput.addEventListener("input", applyFilters);
      resetBtn.addEventListener("click", () => {
        searchInput.value = "";
        applyFilters();
      });

      init();
    </script>
  </body>
</html>
